<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SPAR Hub"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="spar-page" content="hub">
<title>SPAR Malta Hub</title>
<script src="firebase-config.js"></script>
<script src="spar-runtime.js"></script>
<script src="spar-ui.js"></script>
<link rel="stylesheet" href="spar.css">
<style>
.adminbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.tile-foot{margin-top:auto;padding-top:6px}
</style>
</head>
<body>
<header class="top" data-store="1"></header>

<main class="page">
  <h2 class="home-hi" id="hi">Welcome</h2>
  <p class="home-sub" id="sub"></p>
  <div id="warn"></div>
  <div class="adminbar" id="adminbar" hidden>
    <a class="btn secondary" href="admin.html">Manage people &amp; stores</a>
  </div>
  <div id="groups"></div>
</main>

<script>
(function () {
  var E = SPARUI.el;
  // Earlier versions moved from claude.ai — shown until the new module replaces them.
  var INTERIM = {
    // (none at the moment)
  };

  SPAR.ready.then(function (me) {
    var first = (me.name || "").split(" ")[0];
    document.getElementById("hi").textContent = "Hello " + first;
    var isDept = me.role === "dept";
    document.getElementById("sub").textContent = isDept ? "You post DAP tasks for " + (me.dept || "your department") + " and see the stores' answers." + (me.cashAccess ? " You also see the stores' cash sheets." : "") : me.seesAll
      ? "You can see all " + me.stores.length + " stores."
      : me.stores.length === 1 ? "Your store: " + me.stores[0].name
      : me.stores.length + " stores: " + me.stores.map(function (s) { return s.name; }).join(", ");
    if (me.isAdmin) document.getElementById("adminbar").hidden = false;

    if (isDept) {
      // departments only use the DAP
    } else if (!me.allStores.length) {
      document.getElementById("warn").innerHTML = "";
      var m = E("p", { class: "msg warn" }, [me.isAdmin
        ? "No stores set up yet. Open Manage people & stores and press “Load SPAR store list”."
        : "The store list hasn't been set up yet. Ask a hub admin."]);
      document.getElementById("warn").appendChild(m);
    } else if (!me.stores.length) {
      document.getElementById("warn").appendChild(E("p", { class: "msg warn" }, ["You haven't been given a store yet. Ask a hub admin to assign you one."]));
    }

    var groups = {}, order = [];
    SPARUI.MODULES.forEach(function (m) {
      var extra = m.alsoIf && me[m.alsoIf];          // e.g. the accounts team also sees the Cash Sheet Analyser
      if (isDept ? (m.id !== "dap" && !extra) : (m.who !== "all" && m.who.indexOf(me.role) < 0 && !extra)) return;
      if (!groups[m.group]) { groups[m.group] = []; order.push(m.group); }
      groups[m.group].push(m);
    });

    var root = document.getElementById("groups");
    order.forEach(function (g) {
      root.appendChild(E("p", { class: "group-label", text: g }));
      var grid = E("div", { class: "home-grid" });
      groups[g].forEach(function (m) {
        var interim = !m.page && INTERIM[m.id] && me.role !== "sm" ? INTERIM[m.id] : null;
        var href = m.page || (interim && interim.page);
        var tile = E(href ? "a" : "div", href ? { class: "home-tile", href: href } : { class: "home-tile soon", "aria-disabled": "true" }, [
          E("span", { class: "ht-icon", "aria-hidden": "true", text: m.icon }),
          E("b", { text: m.name }),
          E("small", { text: m.desc }),
          E("div", { class: "tile-foot" }, [
            m.page ? null : E("span", { class: interim ? "pill warn" : "pill grey", text: interim ? interim.note : "Coming soon" })
          ])
        ]);
        if (m.id === "dap") tile.appendChild(E("span", { class: "badge", id: "dapBadge" }));
        grid.appendChild(tile);
      });
      root.appendChild(grid);
    });

    if (!isDept) dapBadge(me);
    document.addEventListener("spar:store", function () { dapBadge(me); });
  });

  // Number of open DAPs for the selected store
  function dapBadge(me) {
    var b = document.getElementById("dapBadge");
    var st = me.firstStore();
    if (!b || !st) return;
    SPAR.firebase().then(function (c) {
      var q = c.fs.query(c.fs.collection(c.db, "modules", "dap", "stores", st.code, "posts"), c.fs.where("status", "==", "open"));
      return c.fs.getDocs(q);
    }).then(function (qs) {
      b.innerHTML = "";
      var now = Date.now();
      var n = qs.docs.filter(function (d) { var r = d.data().releaseAt; return r && r <= now; }).length;
      if (n) b.appendChild(SPARUI.el("span", { class: "pill red", text: n + " to do" }));
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
