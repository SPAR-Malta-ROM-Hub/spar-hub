<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#ffffff">
<meta name="spar-page" content="module">
<meta name="spar-tool" content="safe">
<title>Safe Count · SPAR Malta Hub</title>
<script src="firebase-config.js"></script>
<script src="spar-runtime.js"></script>
<script src="spar-ui.js"></script>
<script src="safe-logic.js"></script>
<script src="coins-logic.js"></script>
<link rel="stylesheet" href="spar.css">
<style>
.bar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:flex-end;padding:14px 18px;margin:0 0 14px}
.bar label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.bar select{font:700 14px Arial,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);min-width:200px;max-width:100%}
.bar .stamp{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right}
.kpi .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:700}
.kpi.red{background:#FDECEC;border-color:#F6C9CB}.kpi.red strong{color:#C5121A}
.kpi.amber{background:#FFF6E3;border-color:#F3DDA9}.kpi.amber strong{color:#9A6200}
.kpi.green strong{color:var(--gd)}
.up{color:var(--gd)} .down{color:var(--red)}
tr.tot td{font-weight:700;background:#F7F8F8;border-top:2px solid var(--line)}
.tablewrap tr.tot td{position:sticky;bottom:0;z-index:1;box-shadow:0 -2px 0 var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:#FAFBFA} tr.sel td{background:#FFF8E6}
.sub2{display:block;font-size:12px;color:var(--muted);font-weight:400}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:#E9EBEA;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;padding:7px 12px;border-radius:8px;font:700 13px Arial,sans-serif;color:var(--ink);cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:#D9DCDB;font-size:11.5px;line-height:18px;text-align:center}
.rowx{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:0 0 12px}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.it .h b{font-size:15px}
.it .t{font-size:14px;line-height:1.45;margin-top:2px}
.it .c{font-size:12.5px;color:var(--muted)}
.it .amt{text-align:right;font-weight:800;font-size:16px;white-space:nowrap}
.it .res{grid-column:1 / -1;margin-top:6px}
.it.done{opacity:.72}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:5px;text-transform:uppercase;white-space:nowrap}
.tag.r{background:#FBE0E1;color:#C5121A}.tag.g{background:#DDF1E4;color:#00703C}.tag.a{background:#FFF0D2;color:#9A6200}.tag.b{background:#E2ECFA;color:#1F4E9A}.tag.n{background:#EEF0EF;color:#55656b}
.note2{background:#F7F8F8;border-radius:9px;padding:8px 10px;font-size:13px;margin-top:6px}
.note2 b{font-size:12px}
.form2{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-top:8px}
@media(max-width:700px){.form2{grid-template-columns:1fr}}
/* the count sheet */
.sheet h3{font-size:15px;margin:0 0 10px}
.sheet .sec{border-top:1px solid var(--line);padding:16px 0 4px;margin-top:6px}
.sheet .sec:first-child{border-top:0;padding-top:0;margin-top:0}
.sheet td input{width:100%;min-width:70px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font:14px Arial,sans-serif;text-align:right;background:#fff}
.sheet td input.l,.sheet td select{text-align:left}
.sheet td select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font:14px Arial,sans-serif;background:#fff}
.sheet td input:focus,.sheet td select:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.sheet .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:800px){.sheet .grid3{grid-template-columns:1fr}}
.sheet .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:700px){.sheet .grid2{grid-template-columns:1fr}}
.gt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0 4px}
@media(max-width:800px){.gt{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gt div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.gt label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase}
.gt strong{display:block;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.gt .big{background:#10252b;color:#fff;border-color:#10252b}.gt .big label{color:#C9D3D6}
.gt .ok{background:#EAF6EE;border-color:#BFE3CB}.gt .ok strong{color:var(--gd)}
.gt .bad{background:#FDECEC;border-color:#F6C9CB}.gt .bad strong{color:#C5121A}
.addrow{margin-top:8px}
.x{appearance:none;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px}
.x:hover{color:var(--red)}
.lock{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px;padding:4px 10px;border-radius:999px;background:#EEF0EF}
.lock.open{background:#FBE0E1;color:#C5121A}
.confirm{border:2px solid var(--ink);border-radius:12px;padding:14px 16px;margin-top:14px;background:#FFFDF6}
.errs{margin:12px 0 0;padding:10px 14px 10px 30px;border-radius:9px;background:#FDECEC;color:#8C0F15;font-size:13.5px}
.ro td{padding:7px 10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top" data-title="Safe Count"></header>

<main class="page">
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="overview" type="button">Overview</button>
    <button class="tab" data-tab="count" type="button" id="tabCount">New count</button>
    <button class="tab" data-tab="history" type="button">Counts</button>
    <button class="tab" data-tab="bags" type="button">Deposit bags <span class="count" id="nBags" hidden></span></button>
    <button class="tab" data-tab="flags" type="button">Flags <span class="count" id="nFlags" hidden></span></button>
    <button class="tab" data-tab="log" type="button" id="tabLog" hidden>Unlock log</button>
  </div>

  <div class="card bar" id="bar">
    <label>View<select id="scope"></select></label>
    <div class="stamp" id="stamp"></div>
  </div>

  <section data-pane="overview"><div id="ovBody"></div></section>
  <section data-pane="count" hidden><div id="countBody"></div></section>
  <section data-pane="history" hidden><div id="histBody"></div></section>
  <section data-pane="bags" hidden><div class="card panel" style="margin-top:0" id="bagBody"></div></section>
  <section data-pane="flags" hidden><div class="card panel" style="margin-top:0"><div class="rowx"><div class="seg" id="fSeg"></div></div><div id="flagList"></div></div></section>
  <section data-pane="log" hidden><div class="card panel" style="margin-top:0" id="logBody"></div></section>
</main>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const E = SPARUI.el;
  const K = window.SafeCheck;

  // ── Tables: 6 rows on show, then scroll; header and total row stay put ──
  function fitTables() {
    document.querySelectorAll(".tablewrap.fit").forEach((w) => {
      const t = w.querySelector("table"); if (!t || !w.offsetParent) return;
      const body = [...t.tBodies].flatMap((b) => [...b.rows]);
      const tot = body.filter((r) => r.classList.contains("tot")), rows = body.filter((r) => !r.classList.contains("tot"));
      if (rows.length <= 6) { w.style.maxHeight = "none"; return; }
      const h = (t.tHead ? t.tHead.offsetHeight : 0) + rows.slice(0, 6).reduce((s, r) => s + r.offsetHeight, 0) + tot.reduce((s, r) => s + r.offsetHeight, 0) + 2;
      if (h > 60) w.style.maxHeight = h + "px";
    });
  }
  let fitQ = 0; const fitSoon = () => { if (!fitQ) fitQ = requestAnimationFrame(() => { fitQ = 0; fitTables(); }); };
  new MutationObserver(fitSoon).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden", "class"] });

  // ── Who can do what ──
  //  · the store counts the safe at every shift handover (store login on the store PC, two names typed in);
  //  · the Store Manager and the ROM each do a weekly check under their own login;
  //  · a saved count is locked straight away; only the store's ROM can unlock it (with a reason) so it can be corrected;
  //  · the accounts team sees every store, read only; Head Office and Support don't see the module.
  const me = await SPAR.ready;
  const accountsOnly = me.cashAccess && ["dept", "hq", "support"].includes(me.role);
  if (!(["admin", "rom", "sm"].includes(me.role) || accountsOnly)) {
    document.querySelector("main").innerHTML = '<div class="card panel"><h2>Safe Count</h2><p class="note">This module is for the stores, their Store Managers and ROMs, and the accounts team. Ask a hub admin if you need access.</p></div>';
    throw new Error("no safe access");
  }
  const { fs, db } = await SPAR.firebase();
  const isAdmin = me.role === "admin";
  const byCode = Object.fromEntries(me.allStores.map((s) => [s.code, s]));
  const nameOf = (c) => (byCode[c] || {}).name || c;
  const romOf = (c) => (byCode[c] && byCode[c].rom) || "No ROM";
  const emailsOf = (s) => String(s || "").toLowerCase().split(/[,;\s]+/).filter((x) => x.includes("@"));
  const isStoreLogin = (c) => emailsOf((byCode[c] || {}).storeEmail).includes(String(me.email || "").toLowerCase());
  const canCount = () => !accountsOnly && ["sm", "rom", "admin"].includes(me.role);
  const canUnlock = (c) => me.role === "rom" && me.stores.some((s) => s.code === c);
  const typesFor = (c) => isAdmin ? ["handover", "sm", "rom"] : me.role === "rom" ? ["rom", "handover"] : isStoreLogin(c) ? ["handover"] : ["handover", "sm"];

  // ── Helpers ──
  const now = () => (window.__sparNow ? window.__sparNow() : Date.now());
  const today = () => K.isoOf(now());
  const { r2, addDays, ms } = K;
  const WINDOW = 35;          // days of counts loaded
  const money = (v) => Math.abs(v).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const eur = (v) => v == null || !isFinite(v) ? "–" : (v < 0 ? "−" : "") + "€" + money(v);
  const sEur = (v) => v == null || !isFinite(v) ? "–" : (v > 0.004 ? "+" : v < -0.004 ? "−" : "") + "€" + money(v);
  const dayShort = (s) => s ? new Date(s + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "";
  const hm = (t) => { const d = new Date(t); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
  const when = (t) => t ? dayShort(K.isoOf(t)) + " " + hm(t) : "–";
  const ago = (t) => { const m = Math.round((now() - t) / 60000); return m < 60 ? m + " min ago" : m < 48 * 60 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago"; };
  const int = (n) => Math.round(n || 0).toLocaleString("en-GB");
  const plural = (n, w) => int(n) + " " + w + (n === 1 ? "" : "s");
  const docId = (s) => String(s).replace(/[\/.#$\[\]]/g, "_").slice(0, 400);
  const numIn = (v) => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
  const typeName = (t) => K.TYPES[t] || "Count";
  const td = (t, cls) => E("td", cls ? { class: cls, text: t } : { text: t });
  const table = (heads, rows, numCols, fit) => E("div", { class: "tablewrap" + (fit === false ? "" : " fit") }, [E("table", null, [
    E("thead", null, [E("tr", null, heads.map((h, i) => E("th", (numCols || []).includes(i) ? { class: "num", text: h } : { text: h })))]),
    E("tbody", null, rows)])]);

  // ── Stores in view ──
  const stores = accountsOnly ? me.allStores.filter((s) => s.active !== false) : me.stores.slice();
  const seesMany = me.seesAll || accountsOnly;
  const scopes = [];
  if (seesMany && stores.length > 1) {
    scopes.push({ id: "all", label: "All stores (" + stores.length + ")", codes: stores.map((s) => s.code) });
    [...new Set(stores.map((s) => romOf(s.code)))].sort().forEach((r) => scopes.push({ id: "rom:" + r, label: r + "'s stores", codes: stores.filter((s) => romOf(s.code) === r).map((s) => s.code) }));
  } else if (stores.length > 1) scopes.push({ id: "mine", label: "My stores (" + stores.length + ")", codes: stores.map((s) => s.code) });
  stores.forEach((s) => scopes.push({ id: "s:" + s.code, label: s.name, codes: [s.code] }));
  if (!scopes.length) { document.querySelector("main").innerHTML = '<p class="msg warn">You haven\'t been given a store yet. Ask a hub admin.</p>'; throw new Error("no stores"); }
  scopes.forEach((s) => $("scope").add(new Option(s.label, s.id)));
  try { const k = localStorage.getItem("sparSafeScope"); if (scopes.some((s) => s.id === k)) $("scope").value = k; } catch (e) {}
  const scope = () => scopes.find((s) => s.id === $("scope").value) || scopes[0];
  const single = () => scope().codes.length === 1;
  $("tabLog").hidden = !isAdmin;
  if (!canCount()) $("tabCount").hidden = true;

  // ── Paths ──
  const CP = (c, ...x) => fs.doc(db, "modules", "safe", "stores", c, ...x);
  const CC = (c, ...x) => fs.collection(db, "modules", "safe", "stores", c, ...x);
  const serverTime = () => fs.serverTimestamp();
  const fromServer = (ref) => (fs.getDocFromServer ? fs.getDocFromServer(ref) : fs.getDoc(ref));

  // ═════════ LOADING ═════════
  const D = {};
  async function loadStore(c, force) {
    if (D[c] && !force) return;
    const cut = new Date(addDays(today(), -WINDOW) + "T00:00:00");
    const [a, b, cs, n, co] = await Promise.all([
      fs.getDocs(fs.query(CC(c, "counts"), fs.where("at", ">=", cut), fs.orderBy("at"))).catch((e) => { console.warn(e); return null; }),
      fs.getDocs(fs.query(CC(c, "counts"), fs.where("at", "<", cut), fs.orderBy("at", "desc"), fs.limit(1))).catch(() => null),
      fs.getDoc(fs.doc(db, "modules", "cash", "stores", c, "state", "latest")).catch(() => null),
      fs.getDocs(CC(c, "notes")).catch(() => null),
      fs.getDocs(fs.query(fs.collection(db, "modules", "coins", "stores", c, "orders"), fs.where("at", ">=", cut))).catch(() => null)]);
    const counts = a ? a.docs.map((d) => Object.assign({}, d.data(), { id: d.id })) : [];
    const before = b && b.docs[0] ? Object.assign({}, b.docs[0].data(), { id: b.docs[0].id }) : null;
    const st = cs && cs.exists() ? cs.data() : null;
    D[c] = { counts, before, cashBags: st ? st.bagList || [] : [], cashLatest: st ? st.latest || "" : "", notes: {}, err: !a };
    if (n) n.docs.forEach((d) => { D[c].notes[d.id] = d.data(); });
    D[c].coinOrders = co ? co.docs.map((d) => Object.assign({}, d.data(), { id: d.id, total: CoinCheck.total(d.data().qty) })) : [];
    compute(c);
  }
  function compute(c) {
    const x = D[c];
    x.rows = K.sequence(x.counts, x.before ? { c: x.before, s: K.sums(x.before) } : null);
    // cash-sheet bags from a week before the first count on (older ones were never in a counted safe)
    const start = x.before ? addDays(today(), -WINDOW) : addDays(x.rows.length ? x.rows[0].day : today(), -7);
    x.track = K.bagTrack(x.rows, x.cashBags.filter((b) => b.date >= start), { today: today() });
    x.flags = K.flags(c, x.rows, x.track, { today: today(), sheetLatest: x.cashLatest, from: addDays(today(), -WINDOW) });
    x.last = x.rows.length ? x.rows[x.rows.length - 1] : null;
    // coin orders still to arrive (the CIT delivery on a count is matched to them)
    const dels = x.rows.filter((r) => r.s.cit > 0).map((r) => ({ id: r.id, at: r.at, day: r.day, cit: r.s.cit, rc: r.c.citRc || "" }));
    x.coinsDue = CoinCheck.match(x.coinOrders || [], dels, now()).orders.filter((o) => ["sent", "late", "waiting"].includes(o.st));
  }
  function allFlags(codes) {
    const seq = Object.fromEntries(codes.filter((c) => D[c]).map((c) => [c, D[c].rows]));
    const list = codes.flatMap((c) => (D[c] ? D[c].flags : [])).concat(K.transferFlags(seq, nameOf));
    list.forEach((f) => { f.note = (D[f.store].notes || {})[docId(f.id)] || null; f.open = !(f.note && f.note.resolved); });
    return list;
  }

  // ═════════ TABS ═════════
  let tab = "overview";
  function showTab(name) {
    tab = name;
    document.querySelectorAll(".tab[data-tab]").forEach((x) => x.classList.toggle("active", x.dataset.tab === name));
    document.querySelectorAll("[data-pane]").forEach((p) => p.hidden = p.dataset.pane !== name);
    render();
  }
  document.querySelectorAll(".tab[data-tab]").forEach((t) => t.onclick = () => { if (t.dataset.tab === "count") form = null; showTab(t.dataset.tab); });
  $("scope").onchange = () => { try { localStorage.setItem("sparSafeScope", $("scope").value); } catch (e) {} openId = null; form = null; render(); };
  function setCount(id, n, warn) { const el = $(id); el.hidden = !n; el.textContent = n; el.style.background = warn ? "" : "#9AA5A9"; }

  let seq = 0;
  async function render() {
    const my = ++seq, codes = scope().codes;
    await Promise.all(codes.map((c) => loadStore(c)));
    if (my !== seq) return;
    const fl = allFlags(codes);
    setCount("nFlags", fl.filter((f) => f.open && f.level === "act").length || fl.filter((f) => f.open).length, fl.some((f) => f.open && f.level === "act"));
    setCount("nBags", codes.reduce((s, c) => s + D[c].track.filter((x) => x.st === "gone" || x.missed).length, 0), true);
    const counted = codes.filter((c) => D[c].last && D[c].last.day === today()).length;
    $("stamp").textContent = single() ? (D[codes[0]].last ? "Last count " + when(D[codes[0]].last.at) + " (" + ago(D[codes[0]].last.at) + ") · " + typeName(D[codes[0]].last.c.type) : "No safe count yet") : counted + " of " + codes.length + " stores counted today";
    if (tab === "overview") return renderOverview(codes, fl);
    if (tab === "count") return renderCount(codes);
    if (tab === "history") return renderHistory(codes);
    if (tab === "bags") return renderBags(codes);
    if (tab === "flags") return renderFlags(codes, fl);
    if (tab === "log") return renderLog();
  }
  const needOne = (box, txt) => { box.innerHTML = ""; box.appendChild(E("div", { class: "card panel", style: "margin-top:0" }, [E("p", { class: "note", text: txt || "Choose one store in View to do this." })])); };
  const goStore = (c) => { const s = scopes.find((x) => x.id === "s:" + c); if (s) { $("scope").value = s.id; try { localStorage.setItem("sparSafeScope", s.id); } catch (e) {} } };

  // ═════════ OVERVIEW ═════════
  function kpi(label, val, sub, cls, go, hint) { return SPARUI.linkTile(E("div", { class: "card kpi " + (cls || "") }, [E("label", { text: label }), E("strong", { text: val }), E("span", { class: "sub", text: sub })]), go, hint); }
  const goLast = (c) => () => { const L = D[c] && D[c].last; openId = L ? c + "/" + L.id : null; showTab("history"); };
  const goBags = () => { bagF = "in"; showTab("bags"); };
  const goFlags = (lv) => () => { fLevel = lv; showTab("flags"); };
  function weekChecks(c) {
    const w = K.mondayOf(today()), rows = D[c].rows.filter((r) => r.day >= w);
    return { sm: rows.some((r) => r.c.type === "sm"), rom: rows.some((r) => r.c.type === "rom") };
  }
  function renderOverview(codes, fl) {
    const box = $("ovBody"); box.innerHTML = "";
    const act = fl.filter((f) => f.open && f.level === "act"), watch = fl.filter((f) => f.open && f.level === "watch");
    const wk = addDays(today(), -6);
    const diffs = codes.flatMap((c) => D[c].rows.filter((r) => r.day >= wk && r.diff != null && Math.abs(r.diff) >= 0.005));
    const inSafe = codes.flatMap((c) => D[c].track.filter((x) => x.st === "in"));
    const counted = codes.filter((c) => D[c].last && D[c].last.day === today());
    const anyData = codes.some((c) => D[c].rows.length);
    if (single()) {
      const c = codes[0], L = D[c].last, w = weekChecks(c);
      box.appendChild(E("div", { class: "kpis", style: "margin-bottom:14px" }, [
        kpi("Cash in the safe", L ? eur(L.s.total) : "–", L ? "at the count of " + when(L.at) : "No count yet", "", goLast(c), "Open the last count"),
        kpi("Last difference", L && L.diff != null ? sEur(L.diff) : "–", L && L.expected != null ? "expected " + eur(L.expected) : "first count", L && L.diff != null && Math.abs(L.diff) >= 0.005 ? "red" : L ? "green" : "", goLast(c), "Open the last count"),

    const show = groups[bagF];
    if (!show.length) { box.appendChild(E("p", { class: "empty", text: bagF === "prob" ? "No problems with the deposit bags." : "No bags here." })); return; }
    const status = (x) => x.st === "out" ? E("span", { class: "tag g", text: "Collected" }) : x.st === "gone" ? E("span", { class: "tag r", text: "Not found" }) : x.st === "unseen" ? E("span", { class: "tag " + (x.missed ? "r" : "a"), text: x.missed ? "Never counted" : "Waiting for a count" }) : E("span", { class: "tag " + (x.daysIn > K.BAG_DAYS ? "a" : "n"), text: "In the safe" });
    const rows = show.map((x) => E("tr", null, [td(x.bag, "mono"), single() ? null : td(nameOf(x.store)), td(x.date ? dayShort(x.date) : "–"), td(x.amt == null ? "–" : eur(x.amt), "num"),
      E("td", null, [status(x)]), td(x.st === "out" ? (x.on ? dayShort(x.on) : "–") + (x.rc ? " · " + x.rc : "") : x.st === "in" ? x.daysIn + " days" : "–"),
      td(x.sheet ? "Cash sheet" : x.src === "float" ? "Deposited from safe" : "Added at a count"), td(x.lastAt ? when(x.lastAt) : "–")].filter(Boolean)));
    const tot = show.reduce((s, x) => s + (Number(x.amt) || 0), 0);
    rows.push(E("tr", { class: "tot" }, [td(plural(show.length, "bag")), single() ? null : td(""), td(""), td(eur(r2(tot)), "num"), td(""), td(""), td(""), td("")].filter(Boolean)));
    box.appendChild(table(["Bag no."].concat(single() ? [] : ["Store"]).concat(["Cash sheet date", "Amount", "Status", "Collected / days in safe", "From", "Last counted"]), rows, single() ? [2] : [3]));
  }

  // ═════════ FLAGS ═════════
  let fLevel = "act", openRes = null;
  function renderFlags(codes, fl) {
    const groups = { act: fl.filter((f) => f.open && f.level === "act"), watch: fl.filter((f) => f.open && f.level === "watch"), done: fl.filter((f) => !f.open), all: fl };
    $("fSeg").innerHTML = "";
    [["act", "Act now"], ["watch", "Watch"], ["done", "Resolved"], ["all", "All"]].forEach(([k, t]) => $("fSeg").appendChild(E("button", { type: "button", class: fLevel === k ? "on" : "", onclick: () => { fLevel = k; render(); } }, [t, E("span", { class: "cnt", text: String(groups[k].length) })])));
    const box = $("flagList"); box.innerHTML = "";
    const list = groups[fLevel];
    if (!list.length) { box.appendChild(E("p", { class: "empty", text: fLevel === "act" ? "Nothing to act on." : "Nothing here." })); return; }
    list.forEach((f) => box.appendChild(itemCard(f)));
  }
  function itemCard(f) {
    const key = f.store + "|" + f.id, n = f.note || {};
    const head = E("div", { class: "h" }, [single() ? null : E("span", { class: "tag n", text: nameOf(f.store) }), E("span", { class: "tag " + (f.level === "act" ? "r" : "a"), text: f.level === "act" ? "Act now" : "Watch" }),
      E("b", { text: f.title }), f.date ? E("span", { class: "c", text: dayShort(f.date) }) : null, f.open ? null : E("span", { class: "tag g", text: "Resolved" })].filter(Boolean));
    const left = E("div", null, [head, E("div", { class: "t", text: f.text })]);
    if (f.countId) left.appendChild(E("button", { class: "linklike", type: "button", style: "font-size:12.5px;margin-top:4px", text: "Open the count", onclick: () => { goStore(f.store); openId = f.store + "/" + f.countId; showTab("history"); } }));
    const amt = f.amt != null && isFinite(f.amt) ? E("div", { class: "amt " + (f.amt < 0 ? "down" : "") , text: f.kind === "diff" || f.kind === "xfer" || f.kind === "calc" ? sEur(f.amt) : eur(f.amt) }) : E("div");
    const res = E("div", { class: "res" });
    if (n.smNote) res.appendChild(E("div", { class: "note2" }, [E("b", { text: "Store Manager · " + (n.smName || "") + " · " + SPARUI.fmtDateTime(n.smAt) }), E("div", { text: n.smNote })]));
    if (n.romNote) res.appendChild(E("div", { class: "note2" }, [E("b", { text: "ROM · " + (n.romName || "") + " · " + SPARUI.fmtDateTime(n.romAt) }), E("div", { text: n.romNote })]));
    if (n.resolved) res.appendChild(E("div", { class: "note2", style: "background:#EAF6EE" }, [E("b", { text: "✓ Resolved by " + (n.resolvedName || "") + (n.resolvedAt ? " · " + SPARUI.fmtDateTime(n.resolvedAt) : "") })]));
    const who = canCount() && !isStoreLogin(f.store) ? (me.role === "rom" ? "rom" : "sm") : null;
    if (openRes === key && who) {
      const ta = E("input", { class: "in", type: "text", placeholder: "What happened and what was done" }); ta.value = (who === "sm" ? n.smNote : n.romNote) || "";
      const cb = E("input", { type: "checkbox" }); cb.checked = !!n.resolved;
      const sv = E("button", { class: "btn small", type: "button", text: "Save" });
      sv.onclick = async () => {
        if (!ta.value.trim()) { SPARUI.toast("Write a short note first", "err"); return; }
        sv.disabled = true;
        const data = who === "sm" ? { smNote: ta.value.trim(), smBy: me.email, smName: me.name, smAt: now() } : { romNote: ta.value.trim(), romBy: me.email, romName: me.name, romAt: now() };
        Object.assign(data, { id: f.id, kind: f.kind, date: f.date || "", resolved: cb.checked });
        if (cb.checked && !n.resolved) Object.assign(data, { resolvedBy: me.email, resolvedName: me.name, resolvedAt: now() });
        try { await fs.setDoc(CP(f.store, "notes", docId(f.id)), data, { merge: true }); D[f.store].notes[docId(f.id)] = Object.assign({}, n, data); openRes = null; SPARUI.toast("Saved"); render(); }
        catch (e) { sv.disabled = false; SPARUI.toast("Couldn't save: " + (e.code || e.message), "err"); }
      };
      res.appendChild(E("div", { class: "form2" }, [ta, E("label", { style: "display:flex;gap:6px;align-items:center;font-weight:700;font-size:13px" }, [cb, "Resolved"]), E("div", { class: "row" }, [sv, E("button", { class: "btn secondary small", type: "button", text: "Cancel", onclick: () => { openRes = null; render(); } })])]));
    } else if (who) res.appendChild(E("div", { class: "row", style: "margin-top:6px" }, [E("button", { class: "btn secondary small", type: "button", text: n.resolved ? "Edit / reopen" : "Resolve / add a note", onclick: () => { openRes = key; render(); } })]));
    return E("div", { class: "it" + (f.open ? "" : " done") }, [left, amt, res.childNodes.length ? res : null].filter(Boolean));
  }

  // ═════════ UNLOCK LOG (admin only) ═════════
  async function renderLog() {
    const box = $("logBody"); box.innerHTML = "";
    if (!isAdmin) return;
    box.appendChild(E("h2", { text: "Unlock log" }));
    box.appendChild(E("p", { class: "note", style: "margin:-4px 0 12px", text: "Every time a ROM unlocked a safe count. Only admins see this page; each unlock is also emailed to you." }));
    try {
      const qs = await fs.getDocs(fs.query(fs.collection(db, "modules", "safe", "audit"), fs.orderBy("at", "desc"), fs.limit(300)));
      const list = qs.docs.map((d) => d.data());
      if (!list.length) { box.appendChild(E("p", { class: "empty", text: "No count has been unlocked." })); return; }
      await Promise.all([...new Set(list.map((a) => a.code))].filter((c) => byCode[c]).map((c) => loadStore(c)));
      box.appendChild(table(["Unlocked", "Store", "Count", "ROM", "Reason", "Now"], list.map((a) => {
        const r = D[a.code] && D[a.code].rows.find((x) => x.id === a.countId);
        const nowTxt = !r ? "–" : r.c.locked === false ? "Still unlocked" : "Corrected · " + eur(a.total) + " → " + eur(r.s.total);
        return E("tr", null, [td(when(ms(a.at))), td(nameOf(a.code)), td(typeName(a.type) + " · " + when(ms(a.countAt))), td(a.byName || a.by), td(a.reason), E("td", null, [E("span", { class: "tag " + (r && r.c.locked === false ? "r" : "a"), text: nowTxt })])]);
      }), []));
    } catch (e) { box.appendChild(E("p", { class: "msg err", text: "Couldn't load the log: " + (e.code || e.message) })); }
  }

  render();
</script>
</body>
