<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#4BC395; --accent-ink:#05231A;
  --crit:#FF8C7C; --crit-bg:#3A1713; --warn:#F1B45B; --warn-bg:#33250F; --ok:#6DCF89; --ok-bg:#142E1C; --info:#8FB3F2; --info-bg:#172238; color-scheme:dark}}
:root[data-theme="dark"]{

  --crit:#FF8C7C; --crit-bg:#3A1713; --warn:#F1B45B; --warn-bg:#33250F; --ok:#6DCF89; --ok-bg:#142E1C; --info:#8FB3F2; --info-bg:#172238; color-scheme:dark}

.ticket.new{border-left-color:var(--info)} .ticket.warn{border-left-color:var(--warn)} .ticket.crit{border-left-color:var(--crit)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.bars{display:flex;flex-direction:column;gap:6px}

.pend{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.pend .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.pend select,.pend input,.inv-form select,.inv-form input,.inv-form textarea{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0}

@media (max-width:560px){.pend{grid-template-columns:1fr}}

.itemlink{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.itemlink:hover{text-decoration-color:var(--accent);color:var(--accent)}
.backdrop{position:fixed;inset:0;background:rgba(10,16,13,.35);z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:11;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.drawer-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.strip{display:flex;gap:3px;flex-wrap:wrap}
.strip span{width:20px;height:20px;border-radius:3px;border:1px solid var(--line);background:var(--surface)}
.strip span.out{background:var(--crit);border-color:var(--crit)}
.strip span.with{background:var(--warn);border-color:var(--warn)}

.strip-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start}
.strip-dates{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
textarea.brief{width:100%;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--ink);padding:10px;resize:vertical}

.sup-form .wide{grid-column:1/-1}
.sup-form .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.4}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1>Gap Check Tracker<small id="subtitle">Daily 1pm gap checks · 6 stores</small></h1>
      <button class="btn primary" id="importBtn" type="button">Import gap check</button>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm,.csv" multiple hidden>
    </div>
    <div class="stores" id="stores" role="group" aria-label="Store"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>
</header>
<div class="wrap"><main id="main"><div class="empty"><strong>Loading gap checks…</strong></div></main></div>
<div id="drawer"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ---------- constants ---------- */
const STORES = [["61","Paceville"],["63","Balluta"],["65","Valletta"],["68","Steps"],["71","Wembley"],["73","Voco"]];
const STORE_NAME = Object.fromEntries(STORES);
const TABS = [["overview","Overview"],["brief","Daily brief"],["out","Out of stock"],["system","Stock on system"],["suppliers","Suppliers"],["cross","Across stores"],["history","Uploads"]];
const RESULTS = ["Pending","Found – all","Found – part","Not found"];
const CAUSES = ["Not yet investigated","Admin / system error","Delivery scanned wrong","Wrong waste scan","Till scanning error","Suspected theft","Supplier short delivery","Item was misplaced","Other"];
const HISTORY_DAYS = 180;
const LS_UI = "gapTracker.ui", LS_DATA = "gapTracker.local";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const pad = n => String(n).padStart(2,"0");
const iso = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
function todayISO(){const d=new Date();return iso(d.getFullYear(),d.getMonth(),d.getDate());}
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return iso(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate());}
function dayDiff(a,b){const p=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5);}
function toISO(v){
  if(v==null||v==="") return null;
  if(v instanceof Date && !isNaN(v)){const t=new Date(v.getTime()+12*36e5);return iso(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate());}
  if(typeof v==="number"){const t=new Date(Date.UTC(1899,11,30)+v*864e5);return iso(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate());}
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{1,2})[-\s/]([A-Za-z]{3})[A-Za-z]*[-\s/](\d{2,4})/))){const mo=MON[m[2].toLowerCase()];if(mo!=null){let y=+m[3];if(y<100)y+=2000;return iso(y,mo,+m[1]);}}
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return iso(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[/.](\d{1,2})[/.](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return iso(y,+m[2]-1,+m[1]);}
  return null;
}
const fmtDate = s => { if(!s) return "–"; const [y,m,d]=s.split("-").map(Number); return `${d} ${"Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ")[m-1]}`; };
const fmtDateY = s => s ? fmtDate(s)+" "+s.slice(0,4) : "–";
const plural = (n,w) => `${n} ${w}${n===1?"":"s"}`;
const storeLabel = c => STORE_NAME[c] ? `${c} ${STORE_NAME[c]}` : `Store ${c}`;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200);}
function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch{return f;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch{return false;}}

/* ---------- state ---------- */
const ui = Object.assign({store:"all",tab:"overview",q:"",supplier:"",dept:"",disc:"all",minDays:0,sort:"days",sysFilter:"all",briefDays:3,item:null}, lsGet(LS_UI,{}));
ui.item=null;
const data = { checks:new Map(), inv:new Map(), sup:new Map(), mode:"loading", ready:{checks:false,inv:false} };
const supId = name => "sup_"+String(name).replace(/[^A-Za-z0-9_\-.~]/g,"_").slice(0,150);
let db=null, downloads=null, pending=[], editing=null, drafts={}, confirmDel=null, memo=null;
const saveUI = () => lsSet(LS_UI,{store:ui.store,tab:ui.tab});

/* ---------- storage ---------- */
async function initStorage(){
  try{ db = window.claude?.use ? await window.claude.use("db") : null; }catch{ db=null; }
  try{ downloads = window.claude?.use ? await window.claude.use("downloads") : null; }catch{ downloads=null; }
  if(!db){
    data.mode="local";
    const l=lsGet(LS_DATA,{checks:{},inv:{}});
    data.checks=new Map(Object.entries(l.checks||{})); data.inv=new Map(Object.entries(l.inv||{})); data.sup=new Map(Object.entries(l.sup||{}));
    data.ready={checks:true,inv:true}; changed(); return;
  }
  data.mode="db";
  db.collection("checks").where("date",">=",addDays(todayISO(),-HISTORY_DAYS)).onSnapshot(snap=>{
    data.checks=new Map(snap.docs.map(d=>[d.id,d.data()])); data.ready.checks=true; changed();
  }, e=>{ data.ready.checks=true; toast("Could not load saved checks: "+(e?.message||e?.code||"error")); changed(); });
  db.collection("investigations").onSnapshot(snap=>{
    data.inv=new Map(snap.docs.map(d=>[d.id,d.data()])); data.ready.inv=true; changed();
  }, e=>{ data.ready.inv=true; changed(); });
  db.collection("suppliers").onSnapshot(snap=>{
    data.sup=new Map(snap.docs.map(d=>[d.id,d.data()])); changed();
  }, ()=>{});
}
async function putSup(id,doc){
  if(data.mode==="db") await db.collection("suppliers").doc(id).set(doc);
  else { data.sup.set(id,doc); persistLocal(); changed(); }
}
function persistLocal(){
  if(data.mode!=="local") return;
  if(!lsSet(LS_DATA,{checks:Object.fromEntries(data.checks),inv:Object.fromEntries(data.inv),sup:Object.fromEntries(data.sup)})) toast("This browser's storage is full. Older checks were not saved.");
}
async function putCheck(id,doc){
  if(data.mode==="db") await db.collection("checks").doc(id).set(doc);
  else { data.checks.set(id,doc); persistLocal(); changed(); }
}
async function removeCheck(id){
  if(data.mode==="db") await db.collection("checks").doc(id).delete();
  else { data.checks.delete(id); persistLocal(); changed(); }
}
async function putInv(id,doc){
  if(data.mode==="db") await db.collection("investigations").doc(id).set(doc);
  else { data.inv.set(id,doc); persistLocal(); changed(); }
}

/* ---------- parsing ---------- */
const COLS = {code:["item code"],dept:["department description","department"],cat:["category description","category"],sup:["supplier name","supplier"],desc:["item description","description"],stock:["total stock","stock","system stock"],disc:["discontinued"],extra:["actual stock","reason for no stock"]};
function parseWorkbook(buf,filename){
  const wb = XLSX.read(buf,{type:"array",cellDates:true});
  let store=null,date=null; const res={withStock:[],noStock:[]};
  for(const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    let h=-1;
    rows.slice(0,15).forEach((r,i)=>{
      const a=String(r[0]??"").trim().toLowerCase();
      if(a==="company"&&r[1]!=null&&!store) store=String(r[1]).trim().replace(/\.0$/,"");
      if(a.startsWith("date")&&r[1]!=null&&!date) date=toISO(r[1]);
      if(h<0&&a==="item code") h=i;
    });
    if(h<0) continue;
    const title=(String(rows[0]?.[0]??"")+" "+name).toLowerCase();
    const kind=/without|no stock|0 stock/.test(title)?"noStock":/with/.test(title)?"withStock":null;
    if(!kind) continue;
    const H=rows[h].map(x=>String(x??"").trim().toLowerCase());
    const ix={}; for(const [k,names] of Object.entries(COLS)) ix[k]=H.findIndex(x=>names.includes(x));
    const seen=new Set();
    for(const r of rows.slice(h+1)){
      const code=String(r[ix.code]??"").trim().replace(/\.0$/,"");
      if(!code||seen.has(code)) continue; seen.add(code);
      const g=k=>ix[k]>=0?r[ix[k]]:null;
      const st=Number(g("stock")); const ex=g("extra");
      res[kind].push([code,String(g("dept")??"").trim(),String(g("cat")??"").trim(),String(g("sup")??"").trim(),String(g("desc")??"").trim(),isFinite(st)?st:null,String(g("disc")??"").trim().toUpperCase().startsWith("Y")?"YES":"NO",ex==null?"":String(ex).trim()]);
    }
  }
  if(!store){const m=filename.match(/\b(61|63|65|68|71|73)\b/);if(m)store=m[1];}

}

const rowObj = r => ({code:r[0],dept:r[1],cat:r[2],sup:r[3]||"(no supplier)",desc:r[4],stock:r[5],disc:r[6]==="YES",extra:r[7]});

function analyse(){
  if(memo) return memo;
  const byStore={};
  for(const [id,c] of data.checks){ (byStore[c.store]=byStore[c.store]||[]).push({id,...c}); }
  const out={};
  for(const [code] of STORES.concat(Object.keys(byStore).filter(k=>!STORE_NAME[k]).map(k=>[k]))){
    const cs=(byStore[code]||[]).sort((a,b)=>a.date<b.date?-1:1);
    const noSets=cs.map(c=>new Set((c.noStock||[]).map(r=>r[0])));
    const wSets=cs.map(c=>new Set((c.withStock||[]).map(r=>r[0])));
    const n=cs.length, latest=cs[n-1]||null, prev=cs[n-2]||null;
    const streak=(sets,code,from)=>{let i=from;while(i>=0&&sets[i].has(code))i--;return i+1;};
    const times=(sets,code)=>sets.reduce((a,s)=>a+(s.has(code)?1:0),0);
    const outRows=[],withRows=[],back=[];
    if(latest){
      for(const r of latest.noStock||[]){
        const o=rowObj(r); const si=streak(noSets,o.code,n-1);
        o.since=cs[si].date; o.days=dayDiff(o.since,latest.date)+1; o.isNew=!prev||!noSets[n-2].has(o.code);
        o.times=times(noSets,o.code); o.store=code; o.firstSeen=cs[noSets.findIndex(s=>s.has(o.code))].date;
        o.alsoWith=times(wSets,o.code); outRows.push(o);
      }
      for(const r of latest.withStock||[]){
        const o=rowObj(r); const si=streak(wSets,o.code,n-1);
        o.since=cs[si].date; o.days=dayDiff(o.since,latest.date)+1; o.isNew=!prev||!wSets[n-2].has(o.code);
        o.times=times(wSets,o.code); o.store=code; withRows.push(o);
      }
      if(prev) for(const r of prev.noStock||[]) if(!noSets[n-1].has(r[0])){
        const o=rowObj(r); const si=streak(noSets,o.code,n-2);
        o.wasOut=dayDiff(cs[si].date,prev.date)+1; o.nowWith=wSets[n-1].has(o.code); o.store=code; back.push(o);
      }
    }
    const series=cs.map(c=>({date:c.date,no:(c.noStock||[]).length,disc:(c.noStock||[]).filter(r=>r[6]==="YES").length,w:(c.withStock||[]).length}));
    out[code]={code,checks:cs,latest,prev,outRows,withRows,back,series};
  }

}

function chartSVG(series){

  const W=1000,H=240,L=40,R=14,T=12,B=30, iw=W-L-R, ih=H-T-B;

  const nice=[1,2,2.5,5,10].map(m=>m*step).find(v=>maxV/v<=5)||step*10; const top=Math.ceil(maxV/nice)*nice;
  const n=series.length, x=i=>L+(n===1?iw/2:i*iw/(n-1)), y=v=>T+ih-v/top*ih;
  const line=(k,c,o=1)=>n>1?`<polyline fill="none" stroke="${c}" stroke-opacity="${o}" stroke-width="2" points="${series.map((s,i)=>`${x(i).toFixed(1)},${y(s[k]).toFixed(1)}`).join(" ")}"/>`:"";
  const dots=(k,c,o=1)=>series.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s[k])}" r="${i===n-1?4:2.5}" fill="${c}" fill-opacity="${o}"><title>${fmtDate(s.date)}: ${s[k]}</title></circle>`).join("");
  let g=""; for(let v=0;v<=top;v+=nice) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const ticks=n===1?[0]:[...new Set([0,Math.floor((n-1)/2),n-1])];
  const xl=ticks.map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="${n===1?"middle":i===0?"start":i===n-1?"end":"middle"}">${fmtDate(series[i].date)}</text>`).join("");
  const last=series[n-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gaps per check over time">${g}${xl}
   ${line("disc","var(--muted)",.6)}${line("no","var(--accent)")}${line("w","var(--info)")}${dots("disc","var(--muted)",.6)}${dots("no","var(--accent)")}${dots("w","var(--info)")}
   <text x="${Math.min(x(n-1)+6,W-R)}" y="${y(last.no)-8}" text-anchor="end" style="fill:var(--accent);font-weight:600">${last.no}</text></svg></div>
   ${n===1?'<p class="hint">Only one check saved so far. The trend fills in as you import each day.</p>':""}`;
}

  <div class="tbl-wrap"><table><thead><tr>${all?"<th>Store</th>":""}<th>Code</th><th>Item</th><th>Supplier</th><th class="num">System stock</th><th>On list</th><th class="num">Times listed</th><th>Found</th><th>Cause</th><th>Status</th><th></th></tr></thead><tbody>
  ${list.map(o=>{const id=invId(o.store,o.code); const v=data.inv.get(id)||{}; const st=v.status||"Open";
    const row=`<tr class="${editing===id?"editing":""}">${all?`<td class="storetag">${o.store}</td>`:""}<td class="code">${esc(o.code)}</td><td class="desc">${itemBtn(o)}${o.extra?`<div class="sub">Actual stock noted: ${esc(o.extra)}</div>`:""}</td><td>${esc(o.sup)}</td><td class="num">${o.stock??"–"}</td>

/* Suppliers */
function supplierAgg(rows){
  const m={};
  for(const o of rows){const s=m[o.sup]=m[o.sup]||{sup:o.sup,items:0,disc:0,days:0,max:0,newC:0,stores:new Set(),codes:new Set(),long:0};
    s.items++; if(o.disc)s.disc++; else{s.days+=o.days; if(o.days>=7)s.long++;} s.max=Math.max(s.max,o.disc?0:o.days); if(o.isNew)s.newC++; s.stores.add(o.store); s.codes.add(o.code);}
  return Object.values(m).map(s=>({...s,avg:s.items-s.disc?s.days/(s.items-s.disc):0,uniq:s.codes.size})).sort((a,b)=>b.items-a.items);
}

  <div class="tbl-wrap"><table><thead><tr><th>Supplier</th><th class="num">Gaps</th>${all?'<th class="num">Unique items</th><th class="num">Stores</th>':""}<th class="num">Orderable</th><th class="num">Discontinued</th><th class="num">New today</th><th class="num">7+ days</th><th class="num">Avg days</th><th class="num">Longest</th><th>Follow-up</th></tr></thead><tbody>
  ${ag.map(s=>{const r=`<tr class="click" data-sup="${esc(s.sup)}"><td><b>${esc(s.sup)}</b></td><td class="num">${s.items}</td>${all?`<td class="num">${s.uniq}</td><td class="num">${s.stores.size}</td>`:""}<td class="num">${s.items-s.disc}</td><td class="num">${s.disc}</td><td class="num">${s.newC}</td><td class="num">${s.long?`<span class="pill ${s.max>=14?"crit":"warn"}">${s.long}</span>`:0}</td><td class="num">${s.avg?s.avg.toFixed(1):"–"}</td><td class="num">${s.max||"–"}</td><td>${followCell(s)}</td></tr>`;

  </tbody></table></div></section>`;
  if(!all){
    const s=S[0]; if(s.checks.length>1){
      const supSet=ag.slice(0,6).map(x=>x.sup);
      h+=`<section class="panel"><h2>Top suppliers over recent checks</h2><p class="hint">Gaps without stock per check for the six suppliers with the most gaps today.</p><div class="tbl-wrap"><table><thead><tr><th>Supplier</th>${s.checks.slice(-10).map(c=>`<th class="num">${fmtDate(c.date)}</th>`).join("")}</tr></thead><tbody>
      ${supSet.map(name=>`<tr><td>${esc(name)}</td>${s.checks.slice(-10).map(c=>`<td class="num">${(c.noStock||[]).filter(r=>(r[3]||"(no supplier)")===name).length}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`;
    }

function followCell(s){
  const sn=data.sup.get(supId(s.sup)); const orderable=s.items-s.disc; const t=todayISO();

  return h;
}

/* Daily brief */
function briefStore(s,th){
  const L=[]; const d=s.latest; if(!d) return `${storeLabel(s.code)}: no gap check imported yet.`;
  const out=s.outRows, ord=out.filter(o=>!o.disc), disc=out.filter(o=>o.disc), longs=ord.filter(o=>o.days>=th).sort((a,b)=>b.days-a.days);
  L.push(`SPAR ${storeLabel(s.code)} – gap check ${fmtDate(d.date)}`);
  L.push(`Gaps with no stock: ${out.length} (${disc.length} discontinued). New since last check: ${out.filter(o=>o.isNew).length}. Back on shelf: ${s.back.length}.`);
  if(s.withRows.length){L.push("");L.push(`Stock on system but shelf empty (${s.withRows.length}) – please refill and send me the quantity found:`);s.withRows.forEach(o=>L.push(`- ${o.code} ${o.desc} (system ${o.stock??"?"})`));}
  const pend=s.back.filter(o=>o.nowWith); if(pend.length){L.push("");L.push(`Delivered but not on shelf yet (${pend.length}):`);pend.forEach(o=>L.push(`- ${o.code} ${o.desc}`));}
  if(longs.length){L.push("");L.push(`Orderable items out ${th}+ days (${longs.length}) – check ordering:`);longs.slice(0,25).forEach(o=>L.push(`- ${o.code} ${o.desc} – ${o.days} days (${o.sup})`));if(longs.length>25)L.push(`…and ${longs.length-25} more`);}
  if(disc.length){L.push("");L.push(`Discontinued gaps (${disc.length}) – remove or replace the facings.`);}
  return L.join("\n");
}
function briefSuppliers(rows,th){
  const m={}; for(const o of rows) if(!o.disc&&o.days>=th){(m[o.sup]=m[o.sup]||{}); const x=m[o.sup][o.code]=m[o.sup][o.code]||{o,stores:[]}; x.stores.push(`${o.store}:${o.days}d`);}
  return Object.entries(m).map(([sup,items])=>({sup,n:Object.keys(items).length,text:[`${sup} – items out of stock ${th}+ days`,...Object.values(items).sort((a,b)=>b.stores.length-a.stores.length).map(x=>`- ${x.o.code} ${x.o.desc} – stores ${x.stores.join(", ")}`),"","Please confirm availability and expected delivery date."].join("\n")})).sort((a,b)=>b.n-a.n);
}

  const sups=briefSuppliers(S.flatMap(s=>s.outRows),th);
  let h=`<section class="panel"><div class="panel-head"><h2>Daily brief</h2><div class="toolbar"><label for="fBrief">Flag orderable gaps out</label><select id="fBrief">${[1,2,3,5,7,14].map(d=>`<option value="${d}" ${d===th?"selected":""}>${d}+ days</option>`).join("")}</select></div></div>
  <p class="hint">Ready-to-send text built from the latest checks. Copy it into WhatsApp or email for the store managers and supplier reps. Edit the threshold to make the lists shorter or longer.</p></section>`;
  h+=`<h2>For store managers</h2><div class="grid2">${S.filter(s=>s.latest).map(s=>briefBox("brief_"+s.code,storeLabel(s.code),briefStore(s,th))).join("")||'<p class="hint">No checks imported yet.</p>'}</div>`;
  h+=`<h2>For suppliers</h2>${sups.length?`<div class="grid2">${sups.map((x,i)=>{const sn=data.sup.get(supId(x.sup));return briefBox("bsup_"+i,x.sup,x.text,`${plural(x.n,"item")}${sn?` · last chased ${fmtDate(sn.chasedOn)}`:""}`);}).join("")}</div>`:`<p class="hint">No orderable items out ${th}+ days.</p>`}`;
  return h;
}

/* ---------- exports ---------- */
async function saveXlsx(name,sheets){
  if(!downloads) return;
  const wb=XLSX.utils.book_new(); for(const [n,rows] of sheets){const ws=XLSX.utils.aoa_to_sheet(rows); ws["!cols"]=rows[0].map((_,i)=>({wch:Math.min(50,Math.max(8,...rows.slice(0,200).map(r=>String(r[i]??"").length)))})); XLSX.utils.book_append_sheet(wb,ws,n);}
  const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  try{ await downloads.save({filename:name,data:new Uint8Array(buf)}); toast("Saved "+name); }
  catch(e){ if(e?.code!=="declined") toast("Could not save the file ("+(e?.code||"error")+")."); }
}
function exportOut(){
  const S=selected(); const rows=sortRows(filterOut(S.flatMap(s=>s.outRows)));
  const t=todayISO(), tag=ui.store==="all"?"all-stores":`${ui.store}-${STORE_NAME[ui.store]}`;
  const items=[["Store","Item Code","Item Description","Department","Category","Supplier","Discontinued","Out since","Days out","New today","Times listed"]].concat(rows.map(o=>[storeLabel(o.store),o.code,o.desc,o.dept,o.cat,o.sup,o.disc?"YES":"NO",o.since,o.days,o.isNew?"Yes":"",o.times]));
  const sup=[["Supplier","Gaps","Orderable","Discontinued","Out 7+ days","Avg days (orderable)","Longest (days)","Stores"]].concat(supplierAgg(rows).map(s=>[s.sup,s.items,s.items-s.disc,s.disc,s.long,+s.avg.toFixed(1),s.max,[...s.stores].join(", ")]));
  saveXlsx(`gaps-${tag}-${t}.xlsx`,[["Items",items],["Suppliers",sup]]);
}
function exportInv(){
  const v=[...data.inv.values()].filter(x=>ui.store==="all"||x.store===ui.store);
  const rows=[["Store","Item Code","Item Description","Supplier","System stock","Result","Qty found","Units unaccounted","Cause","Status","Notes","Updated"]].concat(v.map(x=>[storeLabel(x.store),x.code,x.desc,x.sup,x.systemStock,x.result,x.qtyFound,Math.max(0,(+x.systemStock||0)-(+x.qtyFound||0)),x.cause,x.status,x.notes,x.updatedAt?new Date(x.updatedAt).toLocaleString():""]));
  saveXlsx(`investigations-${ui.store==="all"?"all-stores":ui.store}-${todayISO()}.xlsx`,[["Investigations",rows]]);
}

/* ---------- events ---------- */
async function savePending(i){
  const p=pending[i]; if(!p.store){toast("Pick the store for "+p.filename);return false;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(p.date)){toast("Pick the check date for "+p.filename);return false;}
  const id=`s${p.store}_${p.date}`;
  try{ await putCheck(id,{store:p.store,date:p.date,filename:p.filename,uploadedAt:new Date().toISOString(),withStock:p.withStock,noStock:p.noStock}); }
  catch(e){ toast(e?.code==="quota_exceeded"?"Storage is full. Delete old checks on the Uploads tab.":"Could not save: "+(e?.message||e?.code||"error")); return false; }
  pending[i]=null; return true;
}
document.addEventListener("click",async e=>{
  const it=e.target.closest("[data-item]"); if(it){ui.item=it.dataset.item;render();return;}
  const b=e.target.closest("[data-store],[data-tab],[data-act],[data-sort],[data-sup]"); if(!b) return;
  if(b.dataset.act){
    const act=b.dataset.act, i=+b.dataset.i;
    if(act==="pick") $("#fileInput").click();
    else if(act==="discard"){pending.splice(i,1);render();}
    else if(act==="discard-all"){pending=[];render();}
    else if(act==="save"){b.disabled=true; const p=pending[i]; if(await savePending(i)){pending=pending.filter(Boolean); toast(`Saved ${storeLabel(p.store)} for ${fmtDate(p.date)}`); if(ui.store!=="all"&&ui.store!==p.store) ui.store=p.store;} render();}
    else if(act==="save-all"){b.disabled=true; let n=0; for(let k=0;k<pending.length;k++) if(await savePending(k)) n++; pending=pending.filter(Boolean); toast(`Saved ${plural(n,"check")}`); render();}
    else if(act==="edit"){const id=b.dataset.id; editing=editing===id?null:id; if(!editing) delete drafts[id]; render();}
    else if(act==="save-inv"){
      const id=b.dataset.id, d=drafts[id]; const a=analyse(); const s=a[b.dataset.store];
      const o=s?.withRows.find(x=>x.code===b.dataset.code); const prev=data.inv.get(id)||{};
      const doc={store:b.dataset.store,code:b.dataset.code,desc:o?.desc??prev.desc??"",sup:o?.sup??prev.sup??"",systemStock:o?.stock??prev.systemStock??null,firstListed:prev.firstListed||o?.since||todayISO(),
        result:d.result,qtyFound:d.qtyFound===""?"":Number(d.qtyFound),cause:d.cause,notes:d.notes,status:d.status,updatedAt:new Date().toISOString()};
      b.disabled=true;
      try{ await putInv(id,doc); editing=null; delete drafts[id]; toast("Investigation saved"); }catch(err){ toast("Could not save: "+(err?.message||err?.code||"error")); b.disabled=false; }
      render();
    }
    else if(act==="del"){confirmDel=b.dataset.id;render();}
    else if(act==="del-no"){confirmDel=null;render();}
    else if(act==="del-yes"){try{await removeCheck(b.dataset.id);toast("Check deleted");}catch(err){toast("Could not delete: "+(err?.code||"error"));} confirmDel=null; render();}
    else if(act==="close-item"){ui.item=null;render();}
    else if(act==="copy"){const ta=document.getElementById(b.dataset.target); try{await navigator.clipboard.writeText(ta.value);toast("Copied");}catch{ta.focus();ta.select();toast("Text selected. Press Ctrl+C to copy.");}}
    else if(act==="save-sup"){const name=b.dataset.name,id=supId(name),d=drafts["sup:"+id]; b.disabled=true;
      try{await putSup(id,{name,chasedOn:d.chasedOn||todayISO(),eta:d.eta||"",reply:d.reply||"",updatedAt:new Date().toISOString()}); delete drafts["sup:"+id]; toast("Follow-up saved for "+name);}catch(err){toast("Could not save: "+(err?.message||err?.code||"error"));} render();}
    else if(act==="export-out") exportOut();
    else if(act==="export-inv") exportInv();
    return;
  }
  if(b.dataset.sort){ui.sort=b.dataset.sort;render();return;}
  if(b.dataset.sup!=null){ui.openSup=ui.openSup===b.dataset.sup?null:b.dataset.sup;render();return;}
  if(b.dataset.store){ui.store=b.dataset.store;ui.supplier="";ui.dept="";editing=null;saveUI();render();return;}
  if(b.dataset.tab){ui.tab=b.dataset.tab;editing=null;saveUI();render();window.scrollTo({top:0});}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ui.q=t.value;render();}
  else if(t.dataset.draft){drafts[t.dataset.draft][t.dataset.field]=t.value;}
  else if(t.dataset.pend!=null&&t.dataset.field==="date"){pending[+t.dataset.pend].date=t.value;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fSup"){ui.supplier=t.value;render();} else if(t.id==="fDept"){ui.dept=t.value;render();}
  else if(t.id==="fDisc"){ui.disc=t.value;render();} else if(t.id==="fMin"){ui.minDays=+t.value;render();}
  else if(t.id==="fSys"){ui.sysFilter=t.value;render();}
  else if(t.id==="fBrief"){ui.briefDays=+t.value;render();}
  else if(t.dataset.draft){drafts[t.dataset.draft][t.dataset.field]=t.value;}
  else if(t.dataset.pend!=null){pending[+t.dataset.pend][t.dataset.field]=t.value;render();}
});
addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.item){ui.item=null;render();}});
$("#importBtn").addEventListener("click",()=>$("#fileInput").click());
$("#fileInput").addEventListener("change",e=>{handleFiles([...e.target.files]);e.target.value="";});
let dragN=0;
addEventListener("dragenter",e=>{if([...(e.dataTransfer?.types||[])].includes("Files")){dragN++;document.body.classList.add("dragging");}});
addEventListener("dragleave",()=>{if(--dragN<=0){dragN=0;document.body.classList.remove("dragging");}});
addEventListener("dragover",e=>e.preventDefault());
addEventListener("drop",e=>{e.preventDefault();dragN=0;document.body.classList.remove("dragging");const f=[...(e.dataTransfer?.files||[])];if(f.length)handleFiles(f);});

render();
initStorage();
</script>
